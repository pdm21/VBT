<!DOCTYPE html>
<html>
  <head>
    <title>VBT Loading</title>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Loading VBT Dashboard...</h1>
      <p>Please wait while the server starts.</p>
    </div>
    <script>
      async function checkApp() {
        try {
          const res = await fetch("/", { cache: "no-store" });
          const text = await res.text();
          if (text.includes("<title>")) {
            window.location.reload();
          }
        } catch (e) {
          // Do nothing if fetch fails
        }
      }

      setInterval(checkApp, 2000); // Check every 2 seconds
    </script>
  </body>
</html>
